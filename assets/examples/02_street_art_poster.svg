<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <title>SprayBot Urban Street-Art Poster</title>
  <defs>
    <linearGradient id="twilightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1035"/>
      <stop offset="28%" stop-color="#6B1D5C"/>
      <stop offset="56%" stop-color="#D63458"/>
      <stop offset="80%" stop-color="#FF7F3F"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
  </defs>

  <!-- 1. Twilight gradient sky backdrop -->
  <rect x="20" y="20" width="960" height="560" rx="14" fill="url(#twilightSky)"/>

  <!-- 2. Geometric sun disc & semi-transparent stencil burst rays -->
  <circle cx="330" cy="300" r="165" fill="#FFD166" opacity="0.88"/>
  <circle cx="330" cy="300" r="128" fill="#FF7F3F" opacity="0.45"/>

  <g id="sun-rays" fill="#FFF3D6" opacity="0.22">
    <polygon points="330,300 40,90 120,40"/>
    <polygon points="330,300 220,25 320,25"/>
    <polygon points="330,300 440,25 540,40"/>
    <polygon points="330,300 650,70 730,140"/>
    <polygon points="330,300 25,240 25,330"/>
  </g>

  <!-- 3. Urban skyline silhouette -->
  <polygon points="20,470 20,390 85,390 85,345 145,345 145,410 190,410 190,320 260,320 260,385 320,385 320,350 400,350 400,405 465,405 465,330 535,330 535,395 605,395 605,360 680,360 680,415 760,415 760,340 845,340 845,390 915,390 915,365 980,365 980,580 20,580"
           fill="#1A1429"/>

  <!-- Skyline semi-transparent neon window highlights -->
  <g fill="#00E5FF" opacity="0.42">
    <rect x="206" y="340" width="14" height="22"/>
    <rect x="230" y="340" width="14" height="22"/>
    <rect x="480" y="350" width="16" height="24"/>
    <rect x="506" y="350" width="16" height="24"/>
    <rect x="778" y="358" width="16" height="22"/>
    <rect x="804" y="358" width="16" height="22"/>
  </g>

  <!-- Foreground street ledge -->
  <rect x="20" y="510" width="960" height="70" fill="#120C1F"/>
  <rect x="20" y="505" width="960" height="10" fill="#00E5FF"/>

  <!-- 4. Stylized Robotic Street-Artist Character -->
  <!-- Offset drop shadow layer (semi-transparent) -->
  <g id="robot-shadow" fill="#0D0717" opacity="0.48" transform="translate(14, 14)">
    <polygon points="235,510 265,335 395,335 425,510"/>
    <rect x="275" y="210" width="110" height="96" rx="16"/>
    <rect x="312" y="302" width="36" height="36"/>
    <polygon points="390,360 475,385 495,340 465,320 390,340"/>
  </g>

  <!-- Robot torso & industrial shoulder plates -->
  <polygon points="235,510 265,335 395,335 425,510" fill="#2A324B" stroke="#120C1F" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="282,360 378,360 392,475 268,475" fill="#FF6B2B"/>
  <rect x="305" y="390" width="50" height="58" rx="6" fill="#1A1429"/>
  <circle cx="330" cy="419" r="14" fill="#00E5FF"/>

  <!-- Robot neck & helmeted head -->
  <rect x="312" y="302" width="36" height="36" fill="#475569" stroke="#120C1F" stroke-width="6"/>
  <rect x="325" y="162" width="10" height="50" fill="#FFD166"/>
  <circle cx="330" cy="156" r="12" fill="#FF2E63"/>

  <rect x="272" y="206" width="116" height="98" rx="16" fill="#E2E8F0" stroke="#120C1F" stroke-width="8"/>
  <!-- Side ear pods -->
  <rect x="254" y="232" width="20" height="46" rx="6" fill="#FF6B2B" stroke="#120C1F" stroke-width="6"/>
  <rect x="386" y="232" width="20" height="46" rx="6" fill="#FF6B2B" stroke="#120C1F" stroke-width="6"/>

  <!-- Visor & semi-transparent highlight slash -->
  <rect x="286" y="226" width="88" height="44" rx="10" fill="#120C1F"/>
  <circle cx="310" cy="248" r="10" fill="#00E5FF"/>
  <circle cx="350" cy="248" r="10" fill="#00E5FF"/>
  <polygon points="292,230 330,230 312,266 292,266" fill="#FFFFFF" opacity="0.32"/>

  <!-- Robot extended arm holding aerosol spray can -->
  <polyline points="392,355 450,378 488,334" fill="none" stroke="#475569" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="392,355 450,378 488,334" fill="none" stroke="#120C1F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="450" cy="378" r="14" fill="#FF6B2B" stroke="#120C1F" stroke-width="5"/>

  <!-- Aerosol can in hand -->
  <rect x="478" y="292" width="32" height="56" rx="5" fill="#FF2E63" stroke="#120C1F" stroke-width="6"/>
  <rect x="484" y="278" width="20" height="14" rx="2" fill="#E2E8F0" stroke="#120C1F" stroke-width="4"/>
  <rect x="490" y="268" width="10" height="10" fill="#FFD166"/>

  <!-- Semi-transparent spray mist cone & splatter -->
  <polygon points="502,272 640,185 655,290" fill="#00E5FF" opacity="0.38"/>
  <polygon points="502,272 605,212 615,275" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="628" cy="212" r="12" fill="#00E5FF" opacity="0.72"/>
  <circle cx="662" cy="242" r="16" fill="#FF2E63" opacity="0.65"/>
  <circle cx="615" cy="268" r="9" fill="#FFD166" opacity="0.78"/>
  <circle cx="688" cy="204" r="7" fill="#00E5FF" opacity="0.60"/>

  <!-- 5. Bold Street-Art Typography (Montserrat / Liberation Sans) -->
  <!-- Semi-transparent text drop shadow -->
  <g font-family="Montserrat, Liberation Sans, sans-serif" font-weight="900" fill="#120C1F" opacity="0.50">
    <text x="548" y="156" font-size="104" letter-spacing="4">SPRAY</text>
    <text x="548" y="256" font-size="112" letter-spacing="6">BOT</text>
  </g>

  <!-- Crisp foreground title text -->
  <g font-family="Montserrat, Liberation Sans, sans-serif" font-weight="900">
    <text x="540" y="148" font-size="104" letter-spacing="4" fill="#FFFFFF">SPRAY</text>
    <text x="540" y="248" font-size="112" letter-spacing="6" fill="#00E5FF">BOT</text>
  </g>

  <!-- Accent banner & subtitle typography -->
  <rect x="542" y="274" width="410" height="44" rx="6" fill="#FF2E63"/>
  <text x="560" y="306" font-family="Montserrat, Liberation Sans, sans-serif" font-weight="800" font-size="26" letter-spacing="3" fill="#FFFFFF">URBAN MURAL STUDIO</text>

  <!-- Stencil badge in bottom right -->
  <rect x="632" y="445" width="320" height="42" rx="4" fill="#FFD166" opacity="0.92"/>
  <text x="649" y="474" font-family="Montserrat, Liberation Sans, sans-serif" font-weight="700" font-size="22" letter-spacing="2" fill="#120C1F">UNIT-07 // 2.5M WALL</text>

  <!-- Outer poster border -->
  <rect x="28" y="28" width="944" height="544" rx="10" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.35"/>
</svg>
